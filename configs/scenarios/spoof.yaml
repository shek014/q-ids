name: spoof
hosts: 8              # h1 victim/capture, h2-h6 spoofers (5), h7-h8 benign
duration: 30

capture: {host: h1, iface: h1-eth0}

servers:
  - {host: h1, module: traffic.benign.iperf_server}

attack:
  # Each spoofer broadcasts forged ARP replies claiming to own the victim's IP. The forged psrc
  # is spoofed, but the Ethernet source MAC is the spoofer's own, so labelling is correct.
  - hosts: [h2, h3, h4, h5, h6]
    class: spoof
    module: traffic.attack.arp_spoof
    args:
      iface: "$self_iface"
      target_ip: "$h1"
      victim_ip: "$h1"
      interval: {range: [1, 3]}
      duration: 30

benign:
  - hosts: [h7]
    module: traffic.benign.ping_flow
    args: {target: "$h1", count: {range: [20, 50]}, interval: {range: [0.5, 1.5]}}
  - hosts: [h8]
    module: traffic.benign.iperf_flow
    args: {target: "$h1", duration: {range: [15, 25]}}
