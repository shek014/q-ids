name: synflood
hosts: 4
duration: 30

capture:
  host: h2
  iface: h2-eth0

# Each flow is labelled by the class of the host that sourced it (see features/extract.py).
# A source not listed here (e.g. the victim's own replies) is labelled benign by default.
host_labels:
  h1: benign
  h3: dos
  h4: benign

# iperf needs a server listening on the target before the client connects.
servers:
  - host: h2
    module: traffic.benign.iperf_server

benign:
  - host: h1
    module: traffic.benign.ping_flow
    args: {target: "$h2", count: 25, interval: 1.0}
  - host: h4
    module: traffic.benign.iperf_flow
    args: {target: "$h2", duration: 25}

attack:
  - host: h3
    module: traffic.attack.syn_flood
    args: {target: "$h2", target_port: 80, rate: 500, duration: 30}
