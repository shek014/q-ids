name: mixed
hosts: 5
duration: 45          # sized for the port scan; the floods/spoof finish earlier

capture:
  host: h2
  iface: h2-eth0

# Three attack classes plus benign traffic in one capture. This only produces correct labels
# because flows are attributed by source MAC (see features/extract.py): the SYN flood spoofs
# its source IP and the ARP poisoning forges its psrc, yet both still carry their sender's real
# MAC, so each attacker's flows land in the right class.
host_labels:
  h1: benign
  h3: dos
  h4: recon
  h5: spoof

servers:
  - host: h2
    module: traffic.benign.iperf_server

benign:
  - host: h1
    module: traffic.benign.ping_flow
    args: {target: "$h2", count: 40, interval: 1.0}
  - host: h1
    module: traffic.benign.iperf_flow
    args: {target: "$h2", duration: 40}

attack:
  - host: h3
    module: traffic.attack.syn_flood
    args: {target: "$h2", target_port: 80, rate: 500, duration: 40}
  - host: h4
    module: traffic.attack.port_scan
    args: {target: "$h2", ports: "1-1024", scan_type: syn, timing: 4}
  - host: h5
    module: traffic.attack.arp_spoof
    args: {iface: h5-eth0, target_ip: "$h1", victim_ip: "$h2", interval: 2, duration: 40}
