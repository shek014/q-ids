name: mixed
hosts: 10             # h1 victim/capture; h2-h3 dos, h4-h5 recon, h6-h7 spoof, h8-h9 ping, h10 iperf
duration: 30

capture: {host: h1, iface: h1-eth0}

servers:
  - {host: h1, module: traffic.benign.iperf_server}

# All three attack classes plus benign in one capture — only correctly labelled because flows are
# attributed by source MAC (see features/extract.py), immune to the IP/ARP spoofing.
attack:
  - hosts: [h2, h3]
    class: dos
    module: traffic.attack.syn_flood
    args: {target: "$h1", target_port: {choice: [80, 443, 22]}, rate: {range: [200, 800]}, duration: 30}
  - hosts: [h4, h5]
    class: recon
    module: traffic.attack.port_scan
    args: {target: "$h1", ports: {choice: ["1-1024", "1-500"]}, scan_type: {choice: [syn, fin]}, rate: {range: [200, 800]}}
  - hosts: [h6, h7]
    class: spoof
    module: traffic.attack.arp_spoof
    args: {iface: "$self_iface", target_ip: "$h1", victim_ip: "$h1", interval: {range: [1, 3]}, duration: 30}

benign:
  - hosts: [h8, h9]
    module: traffic.benign.ping_flow
    args: {target: "$h1", count: {range: [20, 50]}, interval: {range: [0.5, 1.5]}}
  - hosts: [h10]
    module: traffic.benign.iperf_flow
    args: {target: "$h1", duration: {range: [15, 25]}}
