name: c2
hosts: 8              # h1 victim/capture + services, h2-h3 C2 beacons, h4-h5 benign heartbeats, h6-h8 background benign
duration: 60         # long enough for several check-ins so a cadence (and its regularity) is visible

capture: {host: h1, iface: h1-eth0}

servers:
  - {host: h1, module: traffic.udp_echo, args: {ports: "9999"}}      # C2 endpoint AND benign-heartbeat sink
  - {host: h1, module: traffic.benign.services, args: {ports: "80,443,8080,22,3306,5432,8000,9000,25,110"}}
  - {host: h1, module: traffic.benign.iperf_server}

attack:
  # C2 beacons (traffic.periodic_client, RIGID regime). The interval range MATCHES the benign
  # heartbeats below, so mean_iat/packet_count/duration/ports all overlap — the ONLY separators are
  # timing regularity (low cv_iat) and payload consistency (low std_packet_size). Step 3's evasion
  # raises jitter/size_jitter into the benign band while the beacon stays functional (still checks in).
  - hosts: [h2, h3]
    class: c2
    module: traffic.periodic_client
    args:
      target: "$h1"
      port: 9999
      interval: {range: [2.0, 8.0]}
      jitter: {range: [0.0, 0.2]}              # rigid; raising this is the core evasion move
      payload_size: {range: [32, 128]}
      size_jitter: {range: [0.0, 0.15]}        # consistent check-in size
      duration: 60

benign:
  # benign heartbeats / polling (SAME client + SAME interval range, LOOSE regime). Structurally
  # identical to the beacons; naturally jittered timing and varied payloads are the confuser that
  # stops beacon detection being trivial. This is the contested boundary the evasion must cross.
  - hosts: [h4, h5]
    module: traffic.periodic_client
    args:
      target: "$h1"
      port: 9999
      interval: {range: [2.0, 8.0]}
      jitter: {range: [0.3, 0.9]}
      payload_size: {range: [32, 128]}
      size_jitter: {range: [0.3, 0.8]}
      duration: 60
  # non-periodic background so "benign" isn't ONLY periodic UDP (bursty TCP app + bulk transfer);
  # easy negatives that add realism without touching the contested c2-vs-heartbeat boundary.
  - hosts: [h6, h7]
    module: traffic.benign.app_client
    args:
      target: "$h1"
      open_ports: "80,443,8080,22,3306,5432,8000,9000,25,110"
      closed_ports: "1234,4321,6666,9999,31337,12345,4444,5555"
      n_ports: {range: [1, 14]}
      closed_ratio: {range: [0.0, 1.0]}
      n_connections: {range: [10, 50]}
  - hosts: [h8]
    module: traffic.benign.iperf_flow
    args: {target: "$h1", duration: {range: [15, 25]}}
