name: recon
hosts: 8              # h1 victim/capture, h2-h6 scanners (5), h7-h8 benign
duration: 30

capture: {host: h1, iface: h1-eth0}

servers:
  - {host: h1, module: traffic.benign.iperf_server}

attack:
  - hosts: [h2, h3, h4, h5, h6]
    class: recon
    module: traffic.attack.port_scan
    args:
      target: "$h1"
      # port range spans obvious sweeps (1-1024) to stealthy few-port probes (1-5) — the
      # near-boundary knob on the unique_dst_ports giveaway (degrades coverage gracefully).
      ports: {choice: ["1-1024", "1-500", "1-100", "1-20", "1-5", "20-40"]}
      scan_type: {choice: [syn, fin, xmas]}
      rate: {range: [50, 800]}

benign:
  - hosts: [h7]
    module: traffic.benign.ping_flow
    args: {target: "$h1", count: {range: [20, 50]}, interval: {range: [0.5, 1.5]}}
  - hosts: [h8]
    module: traffic.benign.iperf_flow
    args: {target: "$h1", duration: {range: [15, 25]}}
