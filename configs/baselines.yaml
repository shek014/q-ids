# Reference detectors (models/baselines). Split must match configs/mlp.yaml and configs/vqc.yaml so
# every detector is trained and tested on the identical flows.
seed: 0
val_size: 0.15
test_size: 0.15

rf:
  n_estimators: 300
  max_depth: null        # grow fully; min_samples_leaf regularizes
  min_samples_leaf: 2

xgb:
  n_estimators: 400
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.9
  colsample_bytree: 0.9
  early_stopping_rounds: 30   # on the validation split

threshold:
  sharpness: 4.0         # logistic slope on the standardized feature; P=0.5 is exactly the fitted cut
